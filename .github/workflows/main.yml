# 天翼云盘自动签到（扫码令牌版）
name: 天翼云盘签到

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '30 1,13 * * *'  # 每天 09:30 和 21:30 (北京时间)
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制执行签到'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  # 签到任务
  checkin:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    outputs:
      success: ${{ steps.checkin.outputs.success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      # 恢复跨次运行持久化的令牌（refreshToken 会轮换，必须缓存最新的）
      - name: Restore token cache
        id: token_cache
        uses: actions/cache/restore@v4
        with:
          path: token.json
          key: cloud189-token-${{ github.run_id }}
          restore-keys: |
            cloud189-token-

      # 无缓存时由脚本从 Secret 播种令牌（在 checkin.js 内处理）

      - name: Run checkin
        id: checkin
        env:
          TYYP_REFRESH_TOKEN: ${{ secrets.TYYP_REFRESH_TOKEN }}
        run: |
          {
            echo "# 天翼云盘签到记录"
            echo ""
            echo "**最后更新:** $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo ""
            echo "## 签到详情"
            echo ""
            node ./checkin.js 2>&1
          } | tee index.md
          if grep -q "所有账户处理完成" index.md; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      # 保存轮换后的最新令牌
      - name: Save token cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: token.json
          key: cloud189-token-${{ github.run_id }}

      - name: Set commit message
        id: commit_msg
        run: echo "message=🤖 自动签到更新 $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ steps.commit_msg.outputs.message }}
          file_pattern: 'index.md'
          commit_options: '--no-verify'
          skip_dirty_check: true
